<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDFワークベンチ β</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/panel.css">
<link rel="stylesheet" href="css/dialogs.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="bar" id="bar1">
  <div class="bar-row">
    <div class="grp">
      <div class="brand"><span class="logo">PDF</span><b>ワークベンチ</b><span class="beta">β</span></div>
      <button class="btn ic" id="btnSide" title="ページ一覧の表示切替"><i data-ic="panel"></i></button>
      <button class="btn" id="btnOpen" title="PDFを開く (Ctrl+O)"><i data-ic="folder"></i><span class="lb">開く</span></button>
      <button class="btn" id="btnMerge" data-needdoc title="別のPDFを末尾に結合"><i data-ic="layers"></i><span class="lb">結合</span></button>
    </div>
    <div class="grp">
      <button class="btn" id="mProof" data-needdoc data-menu title="校正（注釈一覧・CSV・注釈の統合・版比較）"><i data-ic="list"></i><span class="lb">校正</span><i data-ic="chev"></i></button>
      <button class="btn" id="mPress" data-needdoc data-menu title="入稿チェック（プリフライト・仕上がり/塗り足し）"><i data-ic="check"></i><span class="lb">入稿</span><i data-ic="chev"></i></button>
      <button class="btn" id="mDoc" data-needdoc data-menu title="文書（ノンブル・柱・分割・透かし・しおり・文字の読み取り）"><i data-ic="book"></i><span class="lb">文書</span><i data-ic="chev"></i></button>
    </div>
    <div class="grp">
      <button class="btn ic" id="btnUndo" title="元に戻す (Ctrl+Z)"><i data-ic="undo"></i></button>
      <button class="btn ic" id="btnRedo" title="やり直し (Ctrl+Y)"><i data-ic="redo"></i></button>
    </div>
    <div class="grp">
      <button class="btn ic" id="btnZoomOut" data-needdoc title="縮小"><i data-ic="zoomout"></i></button>
      <select id="zoomSel" data-needdoc title="表示倍率">
        <option value="50">50%</option><option value="75">75%</option><option value="100">100%</option>
        <option value="125">125%</option><option value="150">150%</option><option value="200">200%</option>
        <option value="300">300%</option><option data-custom hidden value="0"></option>
      </select>
      <button class="btn ic" id="btnZoomIn" data-needdoc title="拡大"><i data-ic="zoomin"></i></button>
      <button class="btn ic" id="btnFit" data-needdoc title="幅に合わせる"><i data-ic="fit"></i></button>
    </div>
    <div class="grp">
      <button class="btn ic" id="btnPrev" data-needdoc title="前のページ"><i data-ic="up"></i></button>
      <input type="number" id="pgIn" min="1" data-needdoc title="ページ番号">
      <span id="pgTotal" class="hint">/ 0</span>
      <button class="btn ic" id="btnNext" data-needdoc title="次のページ"><i data-ic="down"></i></button>
    </div>
    <div class="grp end">
      <span class="fname" id="fname"></span>
      <input class="author" id="author" placeholder="作成者名" title="注釈に記録する作成者名（著者・編集者・校正者など）">
      <button class="btn" id="btnExtract" data-needdoc title="選択ページ(未選択なら表示中のページ)だけを別PDFとして保存"><i data-ic="scissors"></i><span class="lb">抽出</span></button>
      <button class="btn primary" id="btnSave" data-needdoc title="編集済みPDFを保存 (Ctrl+S)"><i data-ic="download"></i><span class="lb">保存</span></button>
      <button class="btn ic" id="btnHelp" title="使い方・β版の制限"><i data-ic="help"></i></button>
      <button class="btn ic" id="btnTheme" title="ライト/ダーク切替"><i data-ic="moon"></i></button>
    </div>
  </div>
</div>

<div class="bar" id="bar2">
  <div class="bar-row">
    <div class="grp">
      <button class="btn active" data-tool="select" data-needdoc title="選択・移動 (V)"><i data-ic="pointer"></i><span class="lb">選択</span></button>
      <button class="btn" data-tool="textsel" data-needdoc title="文字選択 (S) — ドラッグで文字を選択し Ctrl+C でコピー"><i data-ic="textsel"></i><span class="lb">文字選択</span></button>
      <button class="btn" data-tool="lasso" data-needdoc title="投げ縄 (Q) — 囲んだ注釈をまとめて移動・複製・コピー・削除"><i data-ic="lasso"></i><span class="lb">投げ縄</span></button>
      <button class="btn" data-tool="text" data-needdoc title="テキストボックスを置く (T) — 中をクリックして入力"><i data-ic="type"></i><span class="lb">テキスト</span></button>
      <button class="btn" data-tool="highlight" data-needdoc title="マーカー (H) — なぞって線を引く。引いた所で止めると直線"><i data-ic="highlighter"></i><span class="lb">マーカー</span></button>
      <button class="btn" data-tool="rect" data-needdoc title="四角形 (R)"><i data-ic="square"></i><span class="lb">四角</span></button>
      <button class="btn" data-tool="ellipse" data-needdoc title="楕円 (O)"><i data-ic="circle"></i><span class="lb">楕円</span></button>
      <button class="btn" data-tool="line" data-needdoc title="線・矢印 (L)"><i data-ic="arrow"></i><span class="lb">線・矢印</span></button>
      <button class="btn" data-tool="pen" data-needdoc title="フリーハンド (P)"><i data-ic="pencil"></i><span class="lb">手書き</span></button>
      <button class="btn" data-tool="eraser" data-needdoc title="消しゴム (E) — 手書きの線を消す"><i data-ic="eraser"></i><span class="lb">消しゴム</span></button>
      <button class="btn" data-tool="redact" data-needdoc title="墨消し (X) — 保存時に下の文字を完全に削除"><i data-ic="redact"></i><span class="lb">墨消し</span></button>
    </div>
    <div class="grp">
      <button class="btn" data-tool="strike" data-needdoc title="トル・削除指示 (D) — 文字の上をドラッグ"><i data-ic="strike"></i><span class="lb">トル</span></button>
      <button class="btn" data-tool="replace" data-needdoc title="置換指示 (C) — 文字の上をドラッグして正しい文字を入力"><i data-ic="replace"></i><span class="lb">置換</span></button>
      <button class="btn" data-tool="insert" data-needdoc title="挿入指示 (I) — 挿入位置をクリック"><i data-ic="caret"></i><span class="lb">挿入</span></button>
      <button class="btn" data-tool="note" data-needdoc title="付箋コメント (N)"><i data-ic="note"></i><span class="lb">付箋</span></button>
    </div>
    <div class="grp">
      <button class="btn" id="btnImage" data-needdoc title="画像を挿入"><i data-ic="image"></i><span class="lb">画像</span></button>
      <button class="btn" id="btnSign" data-needdoc title="手書き署名を作成して挿入"><i data-ic="sign"></i><span class="lb">署名</span></button>
      <button class="btn" id="btnStamp" data-needdoc title="スタンプを挿入"><i data-ic="stamp"></i><span class="lb">スタンプ</span></button>
    </div>
    <div class="grp opts">
      <label class="opt" data-for="text highlight marker rect ellipse line pen strike replace insert">色<input type="color" id="optColor" value="#e11d48"></label>
      <label class="opt" data-for="rect ellipse"><input type="checkbox" id="optFillOn">塗り<input type="color" id="optFill" value="#ffffff"></label>
      <label class="opt" data-for="rect ellipse line pen">太さ
        <select id="optLw"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option><option>12</option></select>
      </label>
      <div class="opt" data-for="highlight marker">太さ
        <span class="seg" id="optMwSeg"><button type="button" class="btn" data-mw="6">細</button><button type="button" class="btn" data-mw="12">中</button><button type="button" class="btn" data-mw="20">太</button></span>
        <input type="number" id="optMw" min="1" max="80" step="1" value="12" title="太さを数値で指定(pt)">pt
      </div>
      <div class="opt" data-for="text strike replace insert">サイズ
        <button type="button" class="btn sm sym" id="optSizeDown" title="文字を一段階小さく" aria-label="文字を小さく">▼</button><input type="number" id="optSize" min="6" max="200" step="1" value="14"><button type="button" class="btn sm sym" id="optSizeUp" title="文字を一段階大きく" aria-label="文字を大きく">▲</button>
      </div>
      <div class="opt" data-for="text">
        <span class="seg fmt"><button type="button" class="btn" id="optBold" title="太字 (Ctrl+B)" aria-label="太字" aria-pressed="false"><span style="font-weight:800">A</span></button><button type="button" class="btn" id="optItalic" title="斜体 (Ctrl+I)" aria-label="斜体" aria-pressed="false"><span style="font-style:italic;font-family:Georgia,'Times New Roman',serif">A</span></button><button type="button" class="btn" id="optUnderline" title="下線 (Ctrl+U)" aria-label="下線" aria-pressed="false"><span style="text-decoration:underline;text-underline-offset:2px">A</span></button><button type="button" class="btn" id="optStrike" title="取り消し線" aria-label="取り消し線" aria-pressed="false"><span style="text-decoration:line-through">A</span></button></span>
      </div>
      <label class="opt" data-for="line"><input type="checkbox" id="optArrow" checked>矢印</label>
      <label class="opt" data-for="insert"><input type="checkbox" id="optVert">縦組み</label>
      <label class="opt" data-for="note"><input type="checkbox" id="optShowNotes">コメントを常に表示</label>
      <button class="btn opt" data-for="lasso" id="btnPaste" title="コピーした注釈を表示中のページに貼り付け (Ctrl+V)"><i data-ic="copy"></i>貼り付け</button>
      <div class="opt" data-for="eraser">太さ
        <span class="seg" id="optEraserSeg"><button type="button" class="btn" data-ew="6">細</button><button type="button" class="btn" data-ew="12">中</button><button type="button" class="btn" data-ew="24">太</button></span>
        <input type="number" id="optEraser" min="1" max="200" step="1" value="12" title="消しゴムの太さを数値で指定(pt)">pt
      </div>
      <label class="opt" data-for="eraser"><input type="checkbox" id="optEraseWhole">線ごと</label>
      <button class="btn opt" data-for="textsel" id="btnOcr" data-needdoc title="スキャンした画像のページから文字を読み取る（OCR）"><i data-ic="scan"></i>文字を読み取る</button>
      <button class="btn opt" data-for="" id="btnDelSel" title="選んでいる注釈を削除 (Delete)"><i data-ic="trash"></i>削除</button>
      <span class="hint" id="optHint"></span>
    </div>
  </div>
</div>

<div class="work">
  <aside class="side" id="side">
    <div class="side-tools">
      <button class="btn" id="btnRotL" data-needdoc title="左に90°回転"><i data-ic="rotl"></i></button>
      <button class="btn" id="btnRotR" data-needdoc title="右に90°回転"><i data-ic="rotr"></i></button>
      <button class="btn" id="btnUp" data-needdoc title="前へ移動"><i data-ic="up"></i></button>
      <button class="btn" id="btnDown" data-needdoc title="後ろへ移動"><i data-ic="down"></i></button>
      <button class="btn" id="btnDup" data-needdoc title="ページを複製"><i data-ic="copy"></i></button>
      <button class="btn" id="btnBlank" data-needdoc title="空白ページを挿入"><i data-ic="filePlus"></i></button>
      <button class="btn" id="btnDel" data-needdoc title="ページを削除"><i data-ic="trash"></i></button>
    </div>
    <div class="side-sub"><label><input type="checkbox" id="chkAll" data-needdoc>すべて選択</label><span id="selCount"></span></div>
    <div class="thumbs" id="thumbs"></div>
  </aside>
  <div class="view" id="view">
    <div id="pages" data-tool="select"></div>
    <div class="empty" id="empty">
      <div class="empty-card">
        <h1>PDFを開いて編集を始める</h1>
        <p>ここにPDFをドラッグ＆ドロップするか、ファイルを選択してください。</p>
        <div class="row">
          <button class="btn primary" id="btnOpen2"><i data-ic="folder"></i>PDFを開く</button>
          <button class="btn" id="btnNew"><i data-ic="filePlus"></i>空白のPDFを作成</button>
        </div>
        <ul><li>校正記号・付箋</li><li>注釈一覧・統合</li><li>版比較</li><li>プリフライト</li><li>ノンブル・柱</li><li>しおり</li><li>透かし</li><li>墨消し</li><li>ページ整理</li><li>結合・分割</li></ul>
      </div>
    </div>
  </div>
  <aside class="rpanel" id="rpanel" hidden>
    <div class="rp-tabs">
      <button class="tab on" data-tab="ann">注釈一覧</button>
      <button class="tab" data-tab="bm">しおり</button>
      <span class="spacer"></span>
      <button class="btn ic" id="rpClose" title="パネルを閉じる"><i data-ic="x"></i></button>
    </div>
    <div class="rp-body" id="rpAnn">
      <div class="rp-tools">
        <select id="annAuthor" title="作成者で絞り込み"></select>
        <select id="annKind" title="種類で絞り込み"></select>
      </div>
      <div class="rp-tools">
        <button class="btn" id="btnCsv" title="表示中の注釈一覧をCSVで書き出し">CSV</button>
        <button class="btn" id="btnAnnOut" title="注釈を共有用ファイル(.json)に書き出し">書き出し</button>
        <button class="btn" id="btnAnnIn" title="他の人が書き出した注釈ファイルを読み込んで統合">読み込み・統合</button>
      </div>
      <div class="alist" id="annList"></div>
    </div>
    <div class="rp-body" id="rpBm" hidden>
      <div class="rp-tools">
        <button class="btn" id="bmAdd" title="表示中のページにしおりを追加"><i data-ic="bookmark"></i>追加</button>
        <button class="btn ic" id="bmUp" title="上へ"><i data-ic="up"></i></button>
        <button class="btn ic" id="bmDown" title="下へ"><i data-ic="down"></i></button>
        <button class="btn ic" id="bmOut" title="階層を上げる"><i data-ic="left"></i></button>
        <button class="btn ic" id="bmIn" title="階層を下げる"><i data-ic="arrow"></i></button>
        <button class="btn ic" id="bmDel" title="削除"><i data-ic="trash"></i></button>
      </div>
      <div class="alist" id="bmList"></div>
    </div>
  </aside>
</div>

<div class="status">
  <span id="stMsg">準備完了</span>
  <span class="spacer"></span>
  <span>ファイルはこの端末のブラウザ内だけで処理され、外部へ送信されません</span>
  <span id="stPage"></span>
</div>

<div class="menu" id="stampMenu"></div>
<div class="menu" id="ddMenu"></div>
<div class="toast" id="toast" role="status"></div>
<div class="busy" id="busy"><div><i class="spin"></i><span>処理中…</span></div></div>
<input type="file" id="fileOpen" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileMerge" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="fileImg" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<input type="file" id="fileAnn" accept="application/json,.json" multiple hidden>
<input type="file" id="fileCmp" accept="application/pdf,.pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<!-- アプリ本体 (読み込み順に依存します。新しいファイルは使う側より前に追加してください) -->
<script src="js/core/config.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/ui/colorpicker.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/geometry.js"></script>
<script src="js/annotations/render.js"></script>
<script src="js/annotations/shape.js"></script>
<script src="js/viewer/pages.js"></script>
<script src="js/viewer/textlayer.js"></script>
<script src="js/viewer/thumbnails.js"></script>
<script src="js/viewer/navigation.js"></script>
<script src="js/editor/history.js"></script>
<script src="js/editor/tools.js"></script>
<script src="js/editor/pointer.js"></script>
<script src="js/editor/eraser.js"></script>
<script src="js/editor/lasso.js"></script>
<script src="js/proof/marks.js"></script>
<script src="js/editor/insert.js"></script>
<script src="js/editor/inline-text.js"></script>
<script src="js/pages/operations.js"></script>
<script src="js/io/open.js"></script>
<script src="js/io/dragdrop.js"></script>
<script src="js/io/save.js"></script>
<script src="js/proof/annotation-list.js"></script>
<script src="js/ui/side-panel.js"></script>
<script src="js/proof/exchange.js"></script>
<script src="js/document/bookmarks.js"></script>
<script src="js/proof/compare.js"></script>
<script src="js/press/preflight.js"></script>
<script src="js/press/boxes.js"></script>
<script src="js/document/folio.js"></script>
<script src="js/document/split.js"></script>
<script src="js/document/watermark.js"></script>
<script src="js/document/ocr.js"></script>
<script src="js/ui/menus.js"></script>
<script src="js/proof/author.js"></script>
<script src="js/ui/update.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/help.js"></script>
<script src="js/ui/keyboard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
